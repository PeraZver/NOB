<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOB — Campaign Extractor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/css/extractor.css" />
</head>
<body>

<!-- ── Top bar ────────────────────────────────────────────────────────────── -->
<div id="topbar">
  <span class="brand">NOB Extractor</span>

  <input id="url-input" type="url"
    placeholder="https://znaci.org/odrednica.php?slug=2-dalmatinska-proleterska-udarna-brigada"
    autocomplete="off" spellcheck="false" />

  <select id="model-select" title="LLM model">
    <option value="">Loading models…</option>
  </select>

  <select id="provider-select" title="Provider override">
    <option value="auto">Auto provider</option>
    <option value="openai">OpenAI</option>
    <option value="anthropic">Anthropic</option>
  </select>

  <button id="filter-toggle-btn" title="Filter by brigade (for division/corps sources)">Filter</button>
  <button id="wiki-toggle-btn" title="Cross-check extracted JSON against a Wikipedia article">Wiki Check</button>
  <button id="review-toggle-btn" title="Load and review an extracted JSON file">Review</button>
  <button id="extract-btn" disabled>Extract</button>
  <button id="save-btn" title="Download extracted JSON">⬇ Save JSON</button>
</div>

<!-- ── Brigade filter bar (collapsible) ───────────────────────────────────── -->
<div id="filter-bar">
  <label for="filter-brigade">Brigade name</label>
  <input id="filter-brigade" type="text"
    placeholder="e.g. 2nd Dalmatian Brigade"
    autocomplete="off" spellcheck="false" />
  <label for="filter-date">Joined from</label>
  <input id="filter-date" type="date" />
  <button id="filter-clear-btn">Clear</button>
  <span id="filter-active-hint">Filter active — only entries relevant to the specified brigade will be extracted</span>
</div>

<!-- ── Wikipedia cross-check bar (collapsible) ────────────────────────────── -->
<div id="wiki-bar">
  <label for="wiki-url-input">Wikipedia URL</label>
  <input id="wiki-url-input" type="url"
    placeholder="https://en.wikipedia.org/wiki/..."
    autocomplete="off" spellcheck="false" />
  <label for="wiki-file-select">File</label>
  <select id="wiki-file-select" title="Select an extracted JSON file to cross-check">
    <option value="">— select file —</option>
  </select>
  <button id="wiki-refresh-btn" title="Refresh file list">↻</button>
  <button id="wiki-check-btn" disabled>Check</button>
</div>

<!-- ── Review bar (collapsible) ────────────────────────────────────────────── -->
<div id="review-bar">
  <label for="review-file-select">File</label>
  <select id="review-file-select" title="Select an extracted JSON file to review">
    <option value="">— select file —</option>
  </select>
  <button id="review-refresh-btn" title="Refresh file list">↻</button>
  <button id="review-load-btn" disabled>Load</button>
  <span id="review-progress"></span>
</div>

<!-- ── Status bar ─────────────────────────────────────────────────────────── -->
<div id="statusbar">
  <span id="status-pill" class="pill idle">Idle</span>
  <span>Chunks: <strong id="stat-chunks">—</strong></span>
  <span>Movements: <strong id="stat-total">—</strong></span>
  <span>Placed: <strong id="stat-placed">—</strong></span>
  <span>Unplaced: <strong id="stat-unplaced">—</strong></span>
  <span id="stat-file" style="color:var(--text-dim);margin-left:auto;"></span>
  <button id="open-file-btn" style="display:none" title="Open file in system text editor">Open file</button>
  <button id="save-review-btn" style="display:none" title="Save edits back to the original JSON file">💾 Save</button>
  <button id="add-entry-btn"  style="display:none" title="Add a new entry manually">＋ Add entry</button>
  <button id="export-db-btn"  style="display:none" title="Download reviewed JSON (deleted entries excluded)">⬇ Export for DB</button>
</div>

<!-- ── Main content ──────────────────────────────────────────────────────── -->
<div id="content">

  <!-- Console pane -->
  <div id="console-pane">
    <div id="console-header">
      <span>Console</span>
      <button id="clear-console">Clear</button>
    </div>
    <div id="console-output"></div>

    <!-- Results table (toggleable, inside console pane) -->
    <div id="results-pane">
      <div id="results-header" onclick="toggleResults()">
        <span id="results-label">Movements (0)</span>
        <span id="results-chevron">▲</span>
      </div>
      <div id="results-table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Date</th>
              <th>Place</th>
              <th>Operation</th>
              <th>Division</th>
              <th>Coords</th>
              <th>📍</th>
              <th class="actions-col"></th>
            </tr>
          </thead>
          <tbody id="results-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Map pane -->
  <div id="map-pane">
    <div id="map"></div>
    <div class="map-overlay" id="map-legend">
      <strong>Campaign Map</strong>
      <div id="legend-content" style="color:var(--text-dim);font-size:0.9em;">No data yet</div>
    </div>
  </div>

</div>

<!-- ── Edit modal ──────────────────────────────────────────────────────────── -->
<div id="edit-modal" style="display:none">
  <div id="edit-modal-inner">
    <div id="edit-modal-header">
      <strong>Edit Entry</strong>
      <div id="edit-modal-nav">
        <button id="edit-prev-btn" title="Previous entry">&#8592;</button>
        <span id="edit-modal-idx"></span>
        <button id="edit-next-btn" title="Next entry">&#8594;</button>
      </div>
    </div>
    <div id="edit-modal-fields">
      <label>Date<input id="edit-date" type="date" /></label>
      <label>Place<input id="edit-place" type="text" /></label>
      <label>Google Maps
        <input id="edit-coords-paste" type="text" autocomplete="off" spellcheck="false"
          placeholder='Paste "43.5081, 16.4402"  or a Google Maps URL' />
      </label>
      <div class="edit-row-2">
        <label>Lat<input id="edit-lat" type="number" step="0.0001" /></label>
        <label>Lng<input id="edit-lng" type="number" step="0.0001" /></label>
      </div>
      <label>Operation
        <div class="edit-field-wrap">
          <input id="edit-operation" type="text" autocomplete="off" />
          <div id="op-dropdown" style="display:none"></div>
        </div>
      </label>
      <label>Division<input id="edit-division" type="text" /></label>
      <label>Notes<textarea id="edit-notes" rows="4"></textarea></label>
    </div>
    <div id="edit-modal-footer">
      <button id="edit-delete-btn">Delete entry</button>
      <div>
        <button id="edit-cancel-btn">Cancel</button>
        <button id="edit-save-btn">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- ── Scripts ────────────────────────────────────────────────────────────── -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/extractor.js"></script>
</body>
</html>
