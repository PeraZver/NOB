<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOB — Campaign Extractor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #1a1b1e;
      --surface:    #26272c;
      --surface2:   #2e3036;
      --border:     #3a3b40;
      --accent:     #4b9cf5;
      --accent-dim: #2a5a9e;
      --ok:         #3dba6a;
      --warn:       #f5a623;
      --err:        #e05252;
      --text:       #d4d6db;
      --text-dim:   #7c7f87;
      --mono:       'Consolas', 'Cascadia Mono', 'Courier New', monospace;
      --sans:       Calibri, 'Segoe UI', Arial, sans-serif;
    }

    html, body { height: 100%; font-family: var(--sans); background: var(--bg); color: var(--text); }

    /* ── Top bar ──────────────────────────────────────────────────────── */
    #topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    #topbar .brand { font-weight: 700; font-size: 1.05em; color: var(--accent); white-space: nowrap; margin-right: 4px; }

    #url-input {
      flex: 1 1 340px;
      min-width: 220px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 10px;
      border-radius: 5px;
      font-family: var(--mono);
      font-size: 0.83em;
    }
    #url-input:focus { outline: none; border-color: var(--accent); }
    #url-input::placeholder { color: var(--text-dim); }

    #model-select, #provider-select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 8px;
      border-radius: 5px;
      font-size: 0.87em;
      cursor: pointer;
    }
    #model-select:focus, #provider-select:focus { outline: none; border-color: var(--accent); }
    select option { background: var(--surface2); }

    #extract-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 5px;
      font-size: 0.9em;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s;
    }
    #extract-btn:hover:not(:disabled) { background: #3587e0; }
    #extract-btn:disabled { background: var(--accent-dim); cursor: not-allowed; opacity: .7; }
    #extract-btn.stop { background: var(--err); }
    #extract-btn.stop:hover { background: #c84444; }

    /* ── Status strip ─────────────────────────────────────────────────── */
    #statusbar {
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      padding: 4px 16px;
      font-size: 0.78em;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      height: 28px;
    }
    #statusbar .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 1px 8px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.95em;
    }
    .pill.idle    { background: #2b2d33; color: var(--text-dim); }
    .pill.running { background: #1a3960; color: var(--accent); }
    .pill.done    { background: #1a3b25; color: var(--ok); }
    .pill.error   { background: #3b1a1a; color: var(--err); }
    .dot-pulse { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.3;} }

    #stat-chunks, #stat-placed, #stat-total { color: var(--text); }

    /* ── Main content: console | map ──────────────────────────────────── */
    #content {
      display: flex;
      flex: 1 1 0;
      overflow: hidden;
      height: calc(100vh - 88px); /* topbar + statusbar */
    }

    /* Console pane */
    #console-pane {
      width: 38%;
      min-width: 280px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: #0d0e10;
    }
    #console-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 6px 12px;
      font-size: 0.78em;
      color: var(--text-dim);
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #clear-console {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 4px;
      padding: 1px 7px;
      font-size: 0.9em;
      cursor: pointer;
    }
    #clear-console:hover { color: var(--text); border-color: var(--text-dim); }

    #console-output {
      flex: 1 1 0;
      overflow-y: auto;
      padding: 8px 10px;
      font-family: var(--mono);
      font-size: 0.78em;
      line-height: 1.55;
    }
    .log-line { display: flex; gap: 8px; padding: 1px 0; }
    .log-ts   { color: #555; flex-shrink: 0; user-select: none; }
    .log-info { color: #9eb8d8; }
    .log-warn { color: var(--warn); }
    .log-error{ color: var(--err); }
    .log-ok   { color: var(--ok); }

    /* Results table pane (inside console pane, togglable) */
    #results-pane {
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: none;
      flex-direction: column;
      max-height: 42%;
    }
    #results-header {
      background: var(--surface2);
      padding: 5px 12px;
      font-size: 0.78em;
      font-weight: 700;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }
    #results-header:hover { background: #33353d; }
    #results-table-wrap {
      overflow: auto;
      flex: 1 1 0;
    }
    table { border-collapse: collapse; width: 100%; font-size: 0.75em; }
    thead th {
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      padding: 4px 8px;
      text-align: left;
      color: var(--text-dim);
      font-weight: 700;
      white-space: nowrap;
      position: sticky;
      top: 0;
    }
    tbody tr:hover { background: var(--surface2); }
    tbody td { padding: 3px 8px; border-bottom: 1px solid #1e1f22; color: var(--text); vertical-align: top; }
    td.placed   { color: var(--ok); text-align: center; }
    td.unplaced { color: var(--err); text-align: center; }
    td.date-cell { color: var(--text-dim); white-space: nowrap; }
    td.coords-cell { font-family: var(--mono); font-size: 0.9em; color: var(--text-dim); }

    /* Map pane */
    #map-pane { flex: 1 1 0; position: relative; }
    #map { height: 100%; width: 100%; }

    /* Map overlay controls */
    .map-overlay {
      position: absolute;
      z-index: 1000;
      background: rgba(26,27,30,.88);
      border: 1px solid var(--border);
      border-radius: 6px;
      backdrop-filter: blur(4px);
    }
    #map-legend {
      top: 10px;
      right: 10px;
      padding: 8px 12px;
      font-size: 0.8em;
      min-width: 160px;
    }
    #map-legend strong { color: var(--text); display: block; margin-bottom: 4px; }
    .legend-row { display: flex; align-items: center; gap: 6px; margin: 2px 0; color: var(--text-dim); font-size: 0.95em; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    #map-center-btn {
      bottom: 70px;
      right: 10px;
      padding: 6px 12px;
      font-size: 0.8em;
      color: var(--text);
      cursor: pointer;
      border: none;
      background: none;
    }
    #map-center-btn:hover { color: var(--accent); }

    /* Save JSON button (appears when done) */
    #save-btn {
      display: none;
      background: var(--ok);
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 0.8em;
      cursor: pointer;
      font-weight: 600;
    }
    #save-btn:hover { background: #32a85c; }

    /* Scrollbar styling for dark theme */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3a3b40; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }

    @media (max-width: 700px) {
      #content { flex-direction: column; }
      #console-pane { width: 100%; border-right: none; border-bottom: 1px solid var(--border); height: 40%; }
      #map-pane { height: 60%; }
    }
  </style>
</head>
<body>

<!-- ── Top bar ────────────────────────────────────────────────────────────── -->
<div id="topbar">
  <span class="brand">NOB Extractor</span>

  <input id="url-input" type="url"
    placeholder="https://znaci.org/odrednica.php?slug=2-dalmatinska-proleterska-udarna-brigada"
    autocomplete="off" spellcheck="false" />

  <select id="model-select" title="LLM model">
    <option value="">Loading models…</option>
  </select>

  <select id="provider-select" title="Provider override">
    <option value="auto">Auto provider</option>
    <option value="openai">OpenAI</option>
    <option value="anthropic">Anthropic</option>
  </select>

  <button id="extract-btn" disabled>Extract</button>
  <button id="save-btn" title="Download extracted JSON">⬇ Save JSON</button>
</div>

<!-- ── Status bar ─────────────────────────────────────────────────────────── -->
<div id="statusbar">
  <span id="status-pill" class="pill idle">Idle</span>
  <span>Chunks: <strong id="stat-chunks">—</strong></span>
  <span>Movements: <strong id="stat-total">—</strong></span>
  <span>Placed: <strong id="stat-placed">—</strong></span>
  <span>Unplaced: <strong id="stat-unplaced">—</strong></span>
  <span id="stat-file" style="color:var(--text-dim);margin-left:auto;"></span>
</div>

<!-- ── Main content ──────────────────────────────────────────────────────── -->
<div id="content">

  <!-- Console pane -->
  <div id="console-pane">
    <div id="console-header">
      <span>Console</span>
      <button id="clear-console">Clear</button>
    </div>
    <div id="console-output"></div>

    <!-- Results table (toggleable, inside console pane) -->
    <div id="results-pane">
      <div id="results-header" onclick="toggleResults()">
        <span id="results-label">Movements (0)</span>
        <span id="results-chevron">▲</span>
      </div>
      <div id="results-table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Date</th>
              <th>Place</th>
              <th>Operation</th>
              <th>Division</th>
              <th>Coords</th>
              <th>📍</th>
            </tr>
          </thead>
          <tbody id="results-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Map pane -->
  <div id="map-pane">
    <div id="map"></div>
    <div class="map-overlay" id="map-legend">
      <strong>Campaign Map</strong>
      <div id="legend-content" style="color:var(--text-dim);font-size:0.9em;">No data yet</div>
    </div>
  </div>

</div>

<!-- ── Scripts ────────────────────────────────────────────────────────────── -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── State ─────────────────────────────────────────────────────────────────────
const STATE = {
  eventSource:    null,
  allMovements:   [],
  placed:         0,
  unplaced:       0,
  chunksDone:     0,
  finalResult:    null,
  markerLayer:    null,
  routeLayer:     null,
  map:            null,
};

// ── Map initialisation ────────────────────────────────────────────────────────
(function initMap() {
  STATE.map = L.map('map', { zoomControl: true }).setView([44.2, 17.5], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 18
  }).addTo(STATE.map);
  STATE.markerLayer = L.layerGroup().addTo(STATE.map);
  STATE.routeLayer  = L.layerGroup().addTo(STATE.map);
})();

// ── Console helper ────────────────────────────────────────────────────────────
const consoleEl = document.getElementById('console-output');

function logLine(message, level = 'info') {
  const ts = new Date().toLocaleTimeString('en-GB', { hour12: false });
  const line = document.createElement('div');
  line.className = 'log-line';

  const className =
    level === 'warn'  ? 'log-warn'  :
    level === 'error' ? 'log-error' :
    level === 'ok'    ? 'log-ok'    : 'log-info';

  line.innerHTML =
    `<span class="log-ts">${ts}</span>` +
    `<span class="${className}">${escHtml(message)}</span>`;
  consoleEl.appendChild(line);

  // Auto-scroll
  consoleEl.scrollTop = consoleEl.scrollHeight;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

document.getElementById('clear-console').addEventListener('click', () => {
  consoleEl.innerHTML = '';
});

// ── Status bar helpers ────────────────────────────────────────────────────────
function setStatus(type, label) {
  const pill = document.getElementById('status-pill');
  pill.className = `pill ${type}`;
  pill.innerHTML = type === 'running'
    ? `<span class="dot-pulse"></span> ${label}`
    : label;
}

function updateStats() {
  document.getElementById('stat-chunks').textContent  = STATE.chunksDone || '—';
  document.getElementById('stat-total').textContent   = STATE.allMovements.length || '—';
  document.getElementById('stat-placed').textContent  = STATE.placed  || '—';
  document.getElementById('stat-unplaced').textContent = STATE.unplaced || '—';
}

// ── Map rendering ─────────────────────────────────────────────────────────────
const ROUTE_COLOR   = '#4b9cf5';
const MARKER_COLOR  = '#4b9cf5';
const MARKER_PLACED = '#3dba6a';

function addMarkersForMovements(movements) {
  movements.forEach(item => {
    if (!item?.coordinates || !isFinite(item.coordinates.lat) || !isFinite(item.coordinates.lng)) return;
    const { lat, lng } = item.coordinates;
    const marker = L.circleMarker([lat, lng], {
      radius: 7,
      color:       MARKER_PLACED,
      fillColor:   MARKER_PLACED,
      fillOpacity: 0.75,
      weight: 2
    });
    marker.bindPopup(buildPopup(item));
    marker.addTo(STATE.markerLayer);
  });
}

function buildPopup(item) {
  const coords = item.coordinates
    ? `${item.coordinates.lat.toFixed(4)}, ${item.coordinates.lng.toFixed(4)}`
    : 'n/a';
  return `<div style="font-family:Calibri,Arial,sans-serif;min-width:180px;max-width:300px;">
    <strong style="font-size:1.05em">${escHtml(item.place || '?')}</strong>
    <div style="color:#666;font-size:.9em;margin:2px 0">${escHtml(item.date || '?')}</div>
    <div style="margin:4px 0 2px"><em>${escHtml(item.operation || '')}</em></div>
    ${item.division ? `<div style="font-size:.88em;color:#555">Division: ${escHtml(item.division)}</div>` : ''}
    ${item.notes    ? `<div style="font-size:.85em;margin-top:5px;color:#333">${escHtml(item.notes.substring(0,260))}${item.notes.length > 260 ? '…' : ''}</div>` : ''}
    <div style="font-size:.75em;color:#aaa;margin-top:6px">📍 ${coords}</div>
  </div>`;
}

function drawRoute(movements) {
  STATE.routeLayer.clearLayers();
  const points = movements
    .filter(m => m?.coordinates && isFinite(m.coordinates.lat) && isFinite(m.coordinates.lng))
    .sort((a, b) => (a.date || '').localeCompare(b.date || ''))
    .map(m => [m.coordinates.lat, m.coordinates.lng]);

  if (points.length >= 2) {
    L.polyline(points, {
      color: ROUTE_COLOR,
      weight: 2.5,
      opacity: 0.55,
      dashArray: '5, 6'
    }).addTo(STATE.routeLayer);
  }
}

function fitMapToMovements(movements) {
  const pts = movements
    .filter(m => m?.coordinates && isFinite(m.coordinates.lat) && isFinite(m.coordinates.lng))
    .map(m => [m.coordinates.lat, m.coordinates.lng]);
  if (pts.length === 0) return;
  try {
    STATE.map.fitBounds(L.latLngBounds(pts), { padding: [30, 30], maxZoom: 10 });
  } catch {}
}

function updateLegend(brigadeName, placed, total) {
  const legendEl = document.getElementById('legend-content');
  const pct = total > 0 ? Math.round(placed / total * 100) : 0;
  legendEl.innerHTML =
    `<div class="legend-row"><span class="legend-dot" style="background:${MARKER_PLACED}"></span> Placed (${placed})</div>` +
    `<div class="legend-row"><span class="legend-dot" style="background:#e05252"></span> Unplaced (${total - placed})</div>` +
    `<hr style="border-color:#3a3b40;margin:5px 0">` +
    `<div style="color:#9eb8d8;font-size:.9em">${escHtml(brigadeName || 'Unknown unit')}</div>` +
    `<div style="color:#7c7f87;font-size:.85em">${placed}/${total} placed (${pct}%)</div>`;
}

// ── Results table ─────────────────────────────────────────────────────────────
const tbody = document.getElementById('results-tbody');
let resultsVisible = true;

function appendTableRows(movements) {
  movements.forEach((item, _) => {
    const row = document.getElementById('results-pane').style.display === 'flex' ? tbody : tbody;
    const tr = document.createElement('tr');
    const hasCoords = item?.coordinates && isFinite(item.coordinates.lat);
    const coordStr = hasCoords
      ? `${item.coordinates.lat.toFixed(3)}, ${item.coordinates.lng.toFixed(3)}`
      : '—';
    tr.innerHTML =
      `<td style="color:var(--text-dim)">${tbody.children.length + 1}</td>` +
      `<td class="date-cell">${escHtml(item.date || '?')}</td>` +
      `<td>${escHtml(item.place || '?')}</td>` +
      `<td>${escHtml((item.operation || '').substring(0, 50))}</td>` +
      `<td style="color:var(--text-dim)">${escHtml(item.division || '—')}</td>` +
      `<td class="coords-cell">${escHtml(coordStr)}</td>` +
      `<td class="${hasCoords ? 'placed' : 'unplaced'}">${hasCoords ? '✓' : '✗'}</td>`;
    tbody.appendChild(tr);
  });
  document.getElementById('results-label').textContent = `Movements (${tbody.children.length})`;
}

function toggleResults() {
  resultsVisible = !resultsVisible;
  const wrap = document.getElementById('results-table-wrap');
  const chev = document.getElementById('results-chevron');
  wrap.style.display      = resultsVisible ? '' : 'none';
  chev.textContent         = resultsVisible ? '▲' : '▼';
}

// ── Model dropdown (populated from server) ────────────────────────────────────
async function loadModels() {
  const sel = document.getElementById('model-select');
  try {
    const resp = await fetch('/api/extractor/models');
    const data = await resp.json();
    sel.innerHTML = '';

    // Group models by provider
    const groups = {};
    data.models.forEach(m => {
      if (!groups[m.provider]) groups[m.provider] = [];
      groups[m.provider].push(m);
    });

    const providerLabels = { anthropic: 'Anthropic', openai: 'OpenAI' };
    Object.entries(groups).forEach(([provider, models]) => {
      const hasKey = data.availableKeys[provider];
      const grp = document.createElement('optgroup');
      grp.label = `${providerLabels[provider] || provider}${hasKey ? '' : ' (no API key)'}`;
      models.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = m.label;
        opt.disabled = !hasKey;
        grp.appendChild(opt);
      });
      sel.appendChild(grp);
    });

    // Pick first enabled option
    const first = Array.from(sel.options).find(o => !o.disabled);
    if (first) first.selected = true;
  } catch (err) {
    sel.innerHTML = '<option value="gpt-4o">gpt-4o</option>';
  }
  document.getElementById('extract-btn').disabled = false;
}
loadModels();

// ── Extraction ────────────────────────────────────────────────────────────────
document.getElementById('extract-btn').addEventListener('click', () => {
  if (STATE.eventSource) {
    stopExtraction();
    return;
  }
  startExtraction();
});

function startExtraction() {
  const url      = document.getElementById('url-input').value.trim();
  const model    = document.getElementById('model-select').value;
  const provider = document.getElementById('provider-select').value;

  if (!url) {
    logLine('Please enter a URL.', 'warn');
    return;
  }

  // Reset state
  STATE.allMovements = [];
  STATE.placed  = 0;
  STATE.unplaced = 0;
  STATE.chunksDone = 0;
  STATE.finalResult = null;
  STATE.markerLayer.clearLayers();
  STATE.routeLayer.clearLayers();
  tbody.innerHTML = '';
  document.getElementById('results-pane').style.display = 'none';
  document.getElementById('save-btn').style.display = 'none';
  document.getElementById('stat-file').textContent = '';
  updateStats();
  updateLegend(null, 0, 0);

  logLine(`Starting extraction…`);
  logLine(`URL: ${url}`);
  logLine(`Model: ${model} | Provider: ${provider}`);

  setStatus('running', 'Extracting');

  const btn = document.getElementById('extract-btn');
  btn.textContent = 'Stop';
  btn.classList.add('stop');

  const params = new URLSearchParams({ url, model, provider });
  const es = new EventSource(`/api/extractor/stream?${params}`);
  STATE.eventSource = es;

  es.addEventListener('log', e => {
    const { message, level } = JSON.parse(e.data);
    logLine(message, level || 'info');
  });

  es.addEventListener('chunk_result', e => {
    const { movements } = JSON.parse(e.data);
    STATE.chunksDone++;
    STATE.allMovements = STATE.allMovements.concat(movements);
    const chunkPlaced = movements.filter(m => m?.coordinates && isFinite(m.coordinates.lat) && isFinite(m.coordinates.lng)).length;
    STATE.placed  += chunkPlaced;
    STATE.unplaced += movements.length - chunkPlaced;
    addMarkersForMovements(movements);
    drawRoute(STATE.allMovements);
    appendTableRows(movements);
    updateStats();
  });

  es.addEventListener('result', e => {
    STATE.finalResult = JSON.parse(e.data);
  });

  es.addEventListener('error', e => {
    try {
      const { message } = JSON.parse(e.data);
      logLine(`Error: ${message}`, 'error');
    } catch {
      // connection errors have no data
      if (STATE.eventSource) logLine('Connection lost.', 'error');
    }
  });

  es.addEventListener('done', e => {
    const { total } = JSON.parse(e.data);
    const placed = STATE.placed;
    logLine(`Done. ${total} movements | ${placed} placed | ${STATE.unplaced} unplaced`, 'ok');

    if (STATE.finalResult) {
      updateLegend(STATE.finalResult.brigade_name, placed, total);
      if (STATE.finalResult.filename) {
        document.getElementById('stat-file').textContent = `Saved: ${STATE.finalResult.filename}`;
      }
      document.getElementById('save-btn').style.display = '';
    }

    setStatus('done', `Done — ${total} movements`);
    fitMapToMovements(STATE.allMovements);

    if (tbody.children.length > 0) {
      document.getElementById('results-pane').style.display = 'flex';
    }

    closeEventSource();
    resetButton();
  });
}

function stopExtraction() {
  closeEventSource();
  resetButton();
  setStatus('idle', 'Stopped');
  logLine('Extraction stopped by user.', 'warn');
}

function closeEventSource() {
  if (STATE.eventSource) {
    STATE.eventSource.close();
    STATE.eventSource = null;
  }
}

function resetButton() {
  const btn = document.getElementById('extract-btn');
  btn.textContent = 'Extract';
  btn.classList.remove('stop');
  btn.disabled = false;
}

// ── Save JSON ─────────────────────────────────────────────────────────────────
document.getElementById('save-btn').addEventListener('click', () => {
  if (!STATE.finalResult) return;
  const blob = new Blob([JSON.stringify(STATE.finalResult, null, 2)], { type: 'application/json' });
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = STATE.finalResult.filename || 'campaign.json';
  a.click();
  URL.revokeObjectURL(a.href);
});

// ── Allow Enter key in URL input ──────────────────────────────────────────────
document.getElementById('url-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('extract-btn').click();
});
</script>
</body>
</html>
